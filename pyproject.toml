[project]
name = "switch-audit"
version = "0.1.0"
description = "交换机漏洞自动审计 Agent 框架"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=1.0.2",
    "netmiko>=4.6.0",
    "paramiko>=4.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "python-dotenv>=1.1.0",
    "structlog>=25.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 119
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "F401", "B008"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
